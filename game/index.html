<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEONVOID — Arena Shooter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #03030c;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: min(100vw, calc(100vh * 1.6));
    height: auto;
    max-height: 100vh;
    background: #050510;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800"></canvas>
<script type="module">
  import { NeonVoidGame } from './src/main.js';
  const canvas = document.getElementById('game');
  new NeonVoidGame(canvas);
</script>
</body>
</html>
